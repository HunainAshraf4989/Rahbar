[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rahbar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi==0.138.1", "httpx==0.28.1", "uvicorn==0.49.0", "python-dotenv==1.2.2", "websockets==16.0"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.setuptools.packages.find]
where = ["app/server"]

[tool.pytest.ini_options]
pythonpath = ["app/server"]
testpaths = ["app/server/tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["app/server/rahbar"]
strict = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
